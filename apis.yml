- name: Sanas Speech AI SDK
  description: >-
    Server-side C++17 and Python SDK for real-time speech enhancement, accent
    translation, and language translation. Applications initialize the SDK with
    an API key, create an audio processor for a chosen model, and stream
    interleaved float32 PCM frames, receiving processed audio and transcript
    callbacks. Inference runs on Sanas Cloud or self-hosted infrastructure.
  humanURL: https://developer.sanas.ai/API-Reference/Overview
  baseURL: https://developer.sanas.ai
