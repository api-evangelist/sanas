name: Sanas
description: >-
  Sanas is a real-time speech AI platform that removes communication barriers
  through accent translation, language translation, speech enhancement, and
  speech intelligence. Its developer platform exposes these capabilities as a
  server-side SDK (C++17 and Python) plus a persistent WebSocket Stream API for
  real-time speech-to-speech translation, letting teams add real-time speech
  processing to voice-agent and contact-center pipelines they already run.
  Models are billed per minute and run on Sanas Cloud or self-hosted
  infrastructure, serving healthcare, financial services, retail, travel, and
  telecommunications customers.
