apis:
- name: Sanas Stream API
  description: >-
    Real-time speech-to-speech translation over a single persistent WebSocket
    connection, supporting consecutive and simultaneous modes. Authenticated
    with a JWT bearer token or API key passed as a query parameter; audio is
    exchanged as raw PCM binary frames with a JSON message layer (init,
    configure, flush, configured, transcript, error).
  humanURL: https://developer.sanas.ai/Docs/Language-Translation/WebSocket-API
  baseURL: wss://api.sanaslt.com/v3/stream
  tags:
  - Speech AI
  - Language Translation
  - WebSocket
  - Streaming
